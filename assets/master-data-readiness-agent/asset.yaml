apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: master-data-readiness-agent
  version: "1.0.0"

agentCard:
  name: Master Data Operational Readiness Agent
  version: "1.0.0"
  description: >
    Orchestrates post-creation operational readiness for SAP S/4HANA master data objects
    (Material, Plant, Customer/BP). Retrieves persona-specific setup checklists from grounded
    knowledge, validates completion via S/4HANA CDS/OData services, guides users through
    data entry for custom table and BRFplus updates, and issues a tamper-evident operational
    readiness declaration with full audit trail.
  capabilities:
    skills:
      - name: checklist-orchestration
        description: Retrieves, classifies and orchestrates the full setup checklist lifecycle for a master data object
      - name: write-orchestration
        description: Guides users through data entry and write flow for Z/Y custom tables and BRFplus decision rules
      - name: audit-trail
        description: Persists every agent action, validation result, user decision and evidence reference to the CAP audit service

provides:
  apis:
    - name: master-data-readiness-agent
      kind: a2a
      ordId: customer.build:apiResource:master-data-readiness-c9931.master-data-readiness-agent:v1

