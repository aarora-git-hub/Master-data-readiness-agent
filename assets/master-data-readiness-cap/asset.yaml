apiVersion: asset.sap/v1
kind: Asset
type: cap

metadata:
  name: master-data-readiness-cap
  version: "1.0.0"

provides:
  apis:
    - name: master-data-readiness-cap
      kind: odata-v4
      ordId: customer.build:apiResource:master-data-readiness-c9931.master-data-readiness-cap:v1
      description: CAP OData service for readiness audit trail events and sessions

container:
  buildPath: .
  port: 4004

probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
